<text x="700" y="180" font-size="16">图号 / 部件 / 示例质量</text>
<text x="700" y="210" font-size="15">1. 主车架 / 20 kg</text>
<text x="700" y="235" font-size="15">2. 左右履带总成 / 24 kg</text>
<text x="700" y="260" font-size="15">3. 驱动减速及制动 / 10 kg</text>
<text x="700" y="285" font-size="15">4. 电池及安装盒 / 16 kg</text>
<text x="700" y="310" font-size="15">5. 座椅与身体支撑 / 10 kg</text>
<text x="700" y="335" font-size="15">6. 调平承载及锁止 / 8 kg</text>
<text x="700" y="360" font-size="15">7. 候选前后支撑机构 / 12 kg</text>
<text x="700" y="385" font-size="15">8. 电控与传感 / 3 kg</text>
<text x="700" y="410" font-size="15">9. 护罩和脚托 / 4 kg</text>
<text x="700" y="435" font-size="15">10. 线束紧固和附件 / 3 kg</text>
<text x="700" y="460" font-size="15">11. 未分配质量占位 / 5 kg</text>
<text x="40" y="1105" font-size="16">红点：70 kg 中立布局整机重心。虚线：该工况手工假设的支撑凸包。</text>
